name: Build macOS Calculator (.app & .dmg)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: 📥 Kodları İndir
        uses: actions/checkout@v4

      - name: ⚙️ Calculator.app ve Calculator.dmg Oluştur
        working-directory: Calculator
        run: |
          chmod +x BuildCalculator.command CreateDMG.command
          ./BuildCalculator.command
          ./CreateDMG.command

      - name: 📦 DMG Paketini Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-macOS-Universal-DMG
          path: Calculator/Calculator.dmg

      - name: 🚀 GitHub Releases (İndirme Sayfası) Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "🍎 MacBook Hesap Makinesi v1.0.0 (Universal macOS 11+)"
          body: |
            ### 🍎 MacBook Özel Kısayollu Hesap Makinesi (v1.0.0)
            - **İndirme:** Aşağıdaki **`Calculator.dmg`** dosyasına tıklayarak doğrudan MacBook'unuza indirebilirsiniz.
            - **Proje Klasörü:** https://github.com/ErgenekonArt/Antigravity/tree/main/Calculator
            - **Uyumluluk:** Tüm MacBook'lar (Apple Silicon M1/M2/M3/M4 ve Intel, macOS 11.0 ve üzeri).
            - **Özel Klavye Kısayolları:** `A` (+), `E` (−), `X` (×), `B` (÷)
          files: Calculator/Calculator.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
