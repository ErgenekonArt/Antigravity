name: Build macOS Calculator (.app & .dmg)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "Calculator/Calculator.dmg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: 📥 Kodları İndir
        uses: actions/checkout@v4

      - name: ⚙️ Calculator.app ve Calculator.dmg Oluştur (Universal)
        working-directory: Calculator
        run: |
          chmod +x BuildCalculator.command CreateDMG.command
          ./CreateDMG.command
          lipo -info Calculator.app/Contents/MacOS/Calculator

      - name: 💾 Yeni Universal Calculator.dmg Dosyasını Depoya Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Calculator/Calculator.dmg
          git diff --staged --quiet || git commit -m "Update Universal Calculator.dmg [skip ci]"
          git push origin HEAD:main || true

      - name: 📦 DMG Paketini Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-macOS-Universal-DMG
          path: Calculator/Calculator.dmg

      - name: 🚀 GitHub Releases Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "🍎 MacBook Hesap Makinesi v1.0.0 (Universal: Intel + M1/M2/M3/M4)"
          files: Calculator/Calculator.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
